"6" fill="#B4B2A9"/><path d="M 316 194 L 316 206 M 320 194 L 320 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="342" cy="188" r="6" fill="#B4B2A9"/><circle cx="342" cy="230" r="6" fill="#B4B2A9"/><path d="M 340 194 L 340 206 M 344 194 L 344 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="366" cy="188" r="6" fill="#B4B2A9"/><circle cx="366" cy="230" r="6" fill="#B4B2A9"/><path d="M 364 194 L 364 206 M 368 194 L 368 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="390" cy="188" r="6" fill="#B4B2A9"/><circle cx="390" cy="230" r="6" fill="#B4B2A9"/><path d="M 388 194 L 388 206 M 392 194 L 392 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="414" cy="188" r="6" fill="#B4B2A9"/><circle cx="414" cy="230" r="6" fill="#B4B2A9"/><path d="M 412 194 L 412 206 M 416 194 L 416 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="438" cy="188" r="6" fill="#B4B2A9"/><circle cx="438" cy="230" r="6" fill="#B4B2A9"/><path d="M 436 194 L 436 206 M 440 194 L 440 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="462" cy="188" r="6" fill="#B4B2A9"/><circle cx="462" cy="230" r="6" fill="#B4B2A9"/><path d="M 460 194 L 460 206 M 464 194 L 464 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="486" cy="188" r="6" fill="#B4B2A9"/><circle cx="486" cy="230" r="6" fill="#B4B2A9"/><path d="M 484 194 L 484 206 M 488 194 L 488 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="510" cy="188" r="6" fill="#B4B2A9"/><circle cx="510" cy="230" r="6" fill="#B4B2A9"/><path d="M 508 194 L 508 206 M 512 194 L 512 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="534" cy="188" r="6" fill="#B4B2A9"/><circle cx="534" cy="230" r="6" fill="#B4B2A9"/><path d="M 532 194 L 532 206 M 536 194 L 536 206" stroke="#B4B2A9" stroke-width="1" fill="none"/><circle cx="558" cy="188" r="6" fill="#B4B2A9"/><circle cx="558" cy="230" r="6" fill="#B4B2A9"/><path d="M 556 194 L 556 206 M 560 194 L 560 206" 