<text x="74" y="412" font-size="11" fill="#888780" text-anchor="start" font-weight="400">脂双层内部：疏水</text>
<text x="200" y="100" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">自由扩散</text>
<path d="M 200 176 L 200 278" stroke="#1D9E75" stroke-width="2.4" fill="none"/><path d="M 195 272 L 200 278 L 205 272" stroke="#1D9E75" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="158" r="13" fill="none" stroke="#1D9E75" stroke-width="1.2"/><text x="200" y="162" font-size="11" fill="#1D9E75" text-anchor="middle" font-weight="400">O₂</text>
<text x="200" y="316" font-size="12" fill="#1D9E75" text-anchor="middle" font-weight="600">顺梯度 · 不需要蛋白 · 不耗能</text>
<text x="390" y="100" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">易化扩散</text>
<rect x="360" y="180" width="60" height="58" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><text x="390" y="213.0" font-size="11" fill="#3C3489" text-anchor="middle" font-weight="400">通道</text>
<path d="M 390 176 L 390 278" stroke="#534AB7" stroke-width="2.4" fill="none"/><path d="M 385 272 L 390 278 L 395 272" stroke="#534AB7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="158" r="13" fill="none" stroke="#534AB7" stroke-width="1.2"/><text x="390" y="162" font-size="11" fill="#534AB7" text-anchor="middle" font-weight="400">葡萄糖</text>
<text x="390" y="316" font-size="12" fill="#534AB7" text-anchor="middle" font-weight="600">顺梯度 · 需要通道 · 不耗能</text>
<text x="580" y="100" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">主动运输</text>
<rect x="548" y="178" width="64" height="62" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="580" y="213.0" font-size="11" fill="#712B13" text-anchor="middle" font-weight="400">泵</text>
<path d="M 580 278 L 580 176" stroke="#993C1D" stroke-width="2.4" fill="none"/><path d="M 575 182 L 580 176 L 585 182" stroke="#993C1D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="258" r="13" fill="none" stroke="#993C1D" stroke-width="1.2"/><text x="580" y="262" font-size="11" fill="#993C1D" text-anchor="middle" font-weight="400">Na⁺</text>
<text x="580" y="316" font-size="12" fill="#993C1D" text-anchor="middle" font-weight="600">逆梯度 · 必须耗能（ATP）</text>
<text x="70" y="360" font-size="12.5" fill="#5F5E5A" text-anchor="start" font-weight="400">钠钾泵：每水解一个 ATP，泵出 3 个 Na⁺、泵进 2 个 K⁺。</text>
<text x="70" y="382" font-size="12.5" fill="#5F5E5A" text-anchor="start" font-weight="400">Na⁺ 顺梯度拖着葡萄糖进小肠细胞时，葡萄糖是逆着自己梯度走的——能量没有消失，只是记在别处的账上。</text>
<text x="70" y="404" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="400">一句话：「需要载体」只说明分子自己过不去；「顺不顺梯度」说明往哪走；「能量从哪来」才说明付了多少。</text>
</svg>
