<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect width="760" height="480" fill="#ffffff"/>
<text x="40" y="42" font-size="19" font-weight="600" fill="#2C2C2A">跨过一张膜的三条路</text>
<text x="40" y="66" font-size="13" fill="#5F5E5A">关键区别不是「要不要载体」，而是两件事：顺不顺梯度、能量从哪来</text>
<text x="70" y="118" font-size="13" fill="#888780" text-anchor="start" font-weight="600">膜外</text>
<text x="70" y="300" font-size="13" fill="#888780" text-anchor="start" font-weight="600">膜内</text>
<path d="M 70 132 L 700 132" stroke="#D3D1C7" stroke-width="1" fill="none"/>
<path d="M 70 286 L 700 286" stroke="#D3D1C7" stroke-width="1" fill="none"/>
